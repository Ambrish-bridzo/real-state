server.port=${APP_PORT:8080}

spring.application.name=${APP_NAME:leadflow-app}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/leadflow}

management.endpoints.web.exposure.include=health,info,metrics

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.leadflow=${LOG_LEVEL_APP:DEBUG}

leadflow.api.version=${API_VERSION:1.0.0}
leadflow.api.environment=${APP_ENVIRONMENT:local}
leadflow.services.database=${SERVICE_DATABASE_STATUS:connected}
leadflow.services.local-gateway=${SERVICE_LOCAL_GATEWAY_STATUS:retired-merged-into-monolith}
leadflow.validation.allowed-email-regex=${VALIDATION_ALLOWED_EMAIL_REGEX:^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$}
leadflow.validation.blocked-domains=${VALIDATION_BLOCKED_DOMAINS:mailinator.com,tempmail.com,example.invalid}
leadflow.security.user-header=${SECURITY_USER_HEADER:X-User-Id}
leadflow.security.public-paths=${SECURITY_PUBLIC_PATHS:/api/v1/health,/auth/login,/auth/signup,/auth/forgot-password,/auth/reset-password,/actuator,/error}
